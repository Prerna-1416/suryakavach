bocpd:
  threshold: 0.6
  hazard: 0.004
  max_run: 500
  cp_window: 6
neupert:
  min_correlation: 0.5
  window_min: 20
horizons: [5, 10, 20, 40]
forecast:
  high_alert: 0.7
impact:
  weights:
    peak_sxr: 0.35
    hardness: 0.25
    impulsivity: 0.15
    suit_nuv: 0.10
    duration: 0.15
  suit_available: false
severity_bands:
  - { max: 2.0, band: "None", r_level: "G0/R0" }
  - { max: 4.0, band: "R1", r_level: "R1" }
  - { max: 6.0, band: "R2-R3", r_level: "R2" }
  - { max: 8.0, band: "R3-R4", r_level: "R4" }
  - { max: 10.01, band: "R5", r_level: "R5" }
replay:
  default_event: "2024-02-22"
  default_speed: 20
  speeds: [1, 5, 20, 60]
data:
  cache_path: ./data
  seed: 42
baseline:
  sxr_onset: 5.0e-7
rate_limit:
  requests_per_minute: 100
cors_origins:
  - http://localhost:5173
  - http://localhost:8080
  - http://127.0.0.1:5173
  - http://127.0.0.1:8080
  - https://suryakavach.vercel.app
